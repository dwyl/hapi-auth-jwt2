# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x, 26.x] # LTS + Latest
        # See supported Node.js release schedule at nodejs.org/en/about/releases

    steps:
    - uses: actions/checkout@v7   # github.com/actions/checkout
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7 # github.com/actions/setup-node 
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
    - run: npm test
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7 # github.com/codecov/codecov-action
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
